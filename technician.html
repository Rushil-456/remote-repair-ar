<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote Repair AR - Aligned Tasks</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #status {
            position: fixed;
            top: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 0 2px 5px black;
            z-index: 100;
        }

        #controls {
            position: fixed;
            bottom: 25px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 12px;
            z-index: 100;
            padding: 0 10px;
            box-sizing: border-box;
        }

        .btn {
            background: rgba(0, 0, 0, 0.85);
            color: #ffcc00;
            border: 2px solid #ffcc00;
            padding: 12px 18px;
            font-family: Arial, sans-serif;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            display: none;
        }

        .btn:active {
            background: #ffcc00;
            color: #000;
        }

        .a-enter-vr {
            display: none !important;
        }
    </style>
</head>

<body>

<div id="status">Point camera at target machine</div>

<div id="controls">
    <!-- Generator Tasks -->
    <button id="btn-t1" class="btn" onclick="runTask(1)">Task 1</button>
    <button id="btn-t2" class="btn" onclick="runTask(2)">Task 2</button>
    <button id="btn-t3" class="btn" onclick="runTask(3)">Task 3</button>
    <button id="btn-t4" class="btn" onclick="runTask(4)">Task 4</button>
    
    <!-- CNC Machine Tasks -->
    <button id="btn-t5" class="btn" onclick="runTask(5)">Task 5</button>
    <button id="btn-t6" class="btn" onclick="runTask(6)">Task 6</button>
    <button id="btn-t7" class="btn" onclick="runTask(7)">Task 7</button>
    <button id="btn-t8" class="btn" onclick="runTask(8)">Task 8</button>
</div>

<a-scene
    mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 2; filterMinCF:0.0001; filterBeta: 0.001;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    renderer="colorManagement: true; precision: highp; antialias: true; preserveDrawingBuffer: true;">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- LIGHTING -->
    <a-light type="ambient" color="#ffffff" intensity="2.0"></a-light>
    <a-light type="directional" position="1 2 2" intensity="1.5"></a-light>

    <!-- ================================================= -->
    <!-- TARGET 0: GENERATOR                               -->
    <!-- ================================================= -->
    <a-entity id="generator-target" mindar-image-target="targetIndex: 0">
        <!-- TASK 1: FUEL CAP -->
        <a-entity id="task1-cap" position="-0.18 0.30 0.02" scale="0.65 0.65 0.65" visible="false">
            <a-entity id="cap-pivot" position="0 0 0" rotation="0 0 0">
                <a-cylinder position="0 0 0" radius="0.065" height="0.025" color="#ffcc00" metalness="0.8" roughness="0.2"></a-cylinder>
                <a-cylinder position="0 0.015 0" radius="0.04" height="0.01" color="#222222"></a-cylinder>
                <a-cylinder position="0 -0.02 0" radius="0.048" height="0.02" color="#888888"></a-cylinder>
            </a-entity>
            <a-ring position="0 -0.01 0" rotation="-90 0 0" radius-inner="0.045" radius-outer="0.07" color="#111111"></a-ring>
        </a-entity>

        <!-- TASK 2: LEVER & PIVOT -->
        <a-entity id="task2-lever" position="0.10 -0.15 0.05" scale="0.75 0.75 0.75" visible="false">
            <a-box position="0 0 0" width="0.12" height="0.08" depth="0.03" color="#444444"></a-box>
            <a-cylinder position="0 0 0.03" radius="0.03" height="0.04" rotation="90 0 0" color="#aaaaaa"></a-cylinder>
            <a-entity id="moving-lever" position="0 0 0.05" rotation="0 0 -25">
                <a-box position="0 0.08 0" width="0.028" height="0.16" depth="0.028" color="#ffcc00"></a-box>
                <a-cylinder position="0 0.17 0" radius="0.03" height="0.07" rotation="90 0 0" color="#222222"></a-cylinder>
                <a-sphere position="0 0.21 0" radius="0.038" color="#333333"></a-sphere>
            </a-entity>
        </a-entity>

        <!-- TASK 3: STARTER KEY -->
        <a-entity id="task3-key" position="-0.14 0.08 0.05" scale="0.9 0.9 0.9" visible="false">
            <a-ring rotation="0 0 0" radius-inner="0.02" radius-outer="0.035" color="#111111"></a-ring>
            <a-entity id="key-pivot" position="0 0 0.18" rotation="0 0 0">
                <a-box position="0 0 -0.05" width="0.008" height="0.02" depth="0.10" color="#d4d4d4" metalness="0.9"></a-box>
                <a-cylinder position="0 0 0.02" radius="0.03" height="0.01" rotation="90 0 0" color="#ffcc00"></a-cylinder>
            </a-entity>
        </a-entity>

        <!-- TASK 4: BREAKER SWITCH -->
        <a-entity id="task4-breaker" position="0.08 0.08 0.05" scale="1.1 1.1 1.1" visible="false">
            <a-box width="0.05" height="0.08" depth="0.02" color="#222222"></a-box>
            <a-entity id="breaker-toggle" position="0 -0.015 0.015" rotation="-35 0 0">
                <a-box position="0 0.015 0.01" width="0.02" height="0.035" depth="0.02" color="#ffcc00"></a-box>
            </a-entity>
        </a-entity>
    </a-entity>

    <!-- ================================================= -->
    <!-- TARGET 1: CNC MACHINE                             -->
    <!-- ================================================= -->
    <a-entity id="cnc-target" mindar-image-target="targetIndex: 1">

        <!-- TASK 5: EMERGENCY STOP BUTTON -->
        <a-entity id="task5-estop" position="-0.32 -0.15 0.08" scale="0.95 0.95 0.95" visible="false">
            <a-cylinder position="0 0 0" radius="0.058" height="0.012" rotation="90 0 0" color="#ffcc00" material="metalness: 0.1; roughness: 0.3"></a-cylinder>
            <a-torus position="0 0 0.006" radius="0.05" radius-tubular="0.006" color="#ffdd00" material="metalness: 0.2; roughness: 0.3"></a-torus>
            
            <a-cylinder position="0 0 0.015" radius="0.038" height="0.018" rotation="90 0 0" color="#aaaaaa" material="metalness: 0.9; roughness: 0.2"></a-cylinder>

            <a-entity id="estop-cap" position="0 0 0.03" rotation="0 0 0">
                <a-cylinder position="0 0 0.012" radius="0.034" height="0.024" rotation="90 0 0" color="#cc0000" material="roughness: 0.2"></a-cylinder>
                <a-sphere position="0 0 0.026" radius="0.042" scale="1 1 0.45" color="#ee0000" material="metalness: 0.1; roughness: 0.2"></a-sphere>
                <a-ring position="0 0 0.036" radius-inner="0.015" radius-outer="0.026" color="#ffffff" opacity="0.9"></a-ring>
            </a-entity>
        </a-entity>

        <!-- TASK 6: MODE SELECTOR SWITCH -->
        <a-entity id="task6-mode" position="-0.20 -0.23 0.05" scale="0.85 0.85 0.85" visible="false">
            <a-cylinder position="0 0 0" radius="0.045" height="0.008" rotation="90 0 0" color="#222222" material="metalness: 0.5; roughness: 0.5"></a-cylinder>
            <a-ring position="0 0 0.005" radius-inner="0.032" radius-outer="0.042" color="#ffffff"></a-ring>
            
            <a-entity id="mode-knob" position="0 0 0.008" rotation="0 0 0">
                <a-cylinder position="0 0 0.01" radius="0.028" height="0.02" rotation="90 0 0" color="#1a1a1a" material="roughness: 0.3"></a-cylinder>
                <a-box position="0 0 0.02" width="0.01" height="0.042" depth="0.018" color="#ffcc00" material="metalness: 0.3; roughness: 0.3"></a-box>
                <a-box position="0 0.015 0.022" width="0.006" height="0.012" depth="0.016" color="#ffffff"></a-box>
            </a-entity>
        </a-entity>

        <!-- TASK 7: CYCLE START BUTTON -->
        <a-entity id="task7-cyclestart" position="-0.30 -0.46 0.05" scale="0.85 0.85 0.85" visible="false">
            <a-cylinder position="0 0 0" radius="0.035" height="0.012" rotation="90 0 0" color="#666666" material="metalness: 0.8; roughness: 0.2"></a-cylinder>
            <a-cylinder position="0 0 0.005" radius="0.028" height="0.01" rotation="90 0 0" color="#111111"></a-cylinder>

            <a-entity id="cyclestart-btn" position="0 0 0.012">
                <a-cylinder position="0 0 0.008" radius="0.024" height="0.016" rotation="90 0 0" color="#00e64d" material="metalness: 0.1; roughness: 0.1; opacity: 0.9"></a-cylinder>
                <a-ring position="0 0 0.017" radius-inner="0.01" radius-outer="0.018" color="#ffffff" opacity="0.6"></a-ring>
            </a-entity>
        </a-entity>

        <!-- TASK 8: FEED OVERRIDE DIAL -->
        <a-entity id="task8-feed" position="0.01 -0.24 0.05" scale="0.85 0.85 0.85" visible="false">
            <a-circle radius="0.045" color="#1b1b1b" material="roughness: 0.6"></a-circle>
            <a-ring position="0 0 0.002" radius-inner="0.035" radius-outer="0.042" color="#cccccc"></a-ring>
            
            <a-entity id="feed-dial" position="0 0 0.005" rotation="0 0 -45">
                <a-cylinder position="0 0 0.01" radius="0.026" height="0.02" rotation="90 0 0" color="#333333" material="metalness: 0.6; roughness: 0.3"></a-cylinder>
                <a-cylinder position="0 0 0.02" radius="0.02" height="0.008" rotation="90 0 0" color="#1a1a1a"></a-cylinder>
                <a-triangle position="0 0.018 0.025" vertex-a="0 0.008 0" vertex-b="-0.004 -0.005 0" vertex-c="0.004 -0.005 0" color="#ff3333"></a-triangle>
            </a-entity>
        </a-entity>

    </a-entity>

</a-scene>

<script>
const urlParams = new URLSearchParams(window.location.search);
const roomId = urlParams.get('room') || 'repair-session-01';

const targetGen = document.querySelector("#generator-target");
const targetCNC = document.querySelector("#cnc-target");
const status = document.querySelector("#status");

// Generator Entities
const task1Cap = document.querySelector("#task1-cap");
const capPivot = document.querySelector("#cap-pivot");
const task2Lever = document.querySelector("#task2-lever");
const movingLever = document.querySelector("#moving-lever");
const task3Key = document.querySelector("#task3-key");
const keyPivot = document.querySelector("#key-pivot");
const task4Breaker = document.querySelector("#task4-breaker");
const breakerToggle = document.querySelector("#breaker-toggle");

// CNC Entities
const task5Estop = document.querySelector("#task5-estop");
const estopCap = document.querySelector("#estop-cap");
const task6Mode = document.querySelector("#task6-mode");
const modeKnob = document.querySelector("#mode-knob");
const task7CycleStart = document.querySelector("#task7-cyclestart");
const cyclestartBtn = document.querySelector("#cyclestart-btn");
const task8Feed = document.querySelector("#task8-feed");
const feedDial = document.querySelector("#feed-dial");

let activeTimers = [];
let activeTarget = null;

let peer = null;
let expertConnection = null;
let cameraStream = null;
let videoCall = null;


/* =========================================================
   CREATE CAMERA STREAM
   ========================================================= */

async function getCameraStream() {

    try {

        cameraStream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: {
                    ideal: "environment"
                },
                width: {
                    ideal: 1280
                },
                height: {
                    ideal: 720
                },
                frameRate: {
                    ideal: 30,
                    max: 30
                }
            },
            audio: false
        });

        console.log("Camera stream ready:", cameraStream);

        return true;

    } catch (error) {

        console.error("Camera error:", error);

        status.innerText =
            "Camera permission required";

        return false;
    }
}


/* =========================================================
   PEERJS
   ========================================================= */

function initPeer() {

    console.log("Starting PeerJS...");
    console.log("Room:", roomId);

    peer = new Peer(roomId);

    peer.on("open", function(id) {

        console.log("Technician Peer ID:", id);

        status.innerText =
            "Room Ready | Point camera at target";

    });


    /* =====================================================
       EXPERT DATA CONNECTION
       ===================================================== */

    peer.on("connection", function(conn) {

        console.log(
            "Expert connected:",
            conn.peer
        );

        expertConnection = conn;

        conn.on("open", function() {

            console.log(
                "Expert data connection opened"
            );

        });


        conn.on("data", function(data) {

            console.log(
                "Received:",
                data
            );

            if (
                data &&
                data.type === "RUN_TASK"
            ) {

                runTask(data.taskNum);

            }

        });


        conn.on("close", function() {

            console.log(
                "Expert disconnected"
            );

            expertConnection = null;

        });


        conn.on("error", function(error) {

            console.error(
                "Data connection error:",
                error
            );

        });

    });


    /* =====================================================
       INCOMING VIDEO CALL
       ===================================================== */

    peer.on("call", function(call) {

        console.log(
            "Incoming video call from:",
            call.peer
        );

        if (!cameraStream) {

            console.error(
                "Camera stream is not ready"
            );

            call.close();

            return;
        }


        console.log(
            "Answering video call..."
        );


        videoCall = call;

        call.answer(cameraStream);


        call.on("close", function() {

            console.log(
                "Video call closed"
            );

            videoCall = null;

        });


        call.on("error", function(error) {

            console.error(
                "Video call error:",
                error
            );

        });

    });


    /* =====================================================
       PEER ERROR
       ===================================================== */

    peer.on("error", function(error) {

        console.error(
            "PeerJS error:",
            error
        );

        if (error.type === "unavailable-id") {

            status.innerText =
                "Room already in use";

        } else {

            status.innerText =
                "Connection error";

        }

    });

}


/* =========================================================
   AR BUTTONS
   ========================================================= */

function showButtonsForTarget(targetType) {

    const genBtns = [1, 2, 3, 4];
    const cncBtns = [5, 6, 7, 8];


    genBtns.forEach(function(num) {

        const btn =
            document.querySelector("#btn-t" + num);

        btn.style.display =
            targetType === "generator"
                ? "block"
                : "none";

    });


    cncBtns.forEach(function(num) {

        const btn =
            document.querySelector("#btn-t" + num);

        btn.style.display =
            targetType === "cnc"
                ? "block"
                : "none";

    });

}


/* =========================================================
   CLEAR TIMERS
   ========================================================= */

function clearAllTimers() {

    activeTimers.forEach(function(t) {

        clearTimeout(t);

    });

    activeTimers = [];

}


/* =========================================================
   RESET TASKS
   ========================================================= */

function resetAllTasks() {

    clearAllTimers();


    // Generator

    [
        task1Cap,
        task2Lever,
        task3Key,
        task4Breaker

    ].forEach(function(el) {

        el.setAttribute(
            "visible",
            "false"
        );

    });


    capPivot.removeAttribute(
        "animation__rotate"
    );

    capPivot.removeAttribute(
        "animation__lift"
    );

    capPivot.setAttribute(
        "rotation",
        "0 0 0"
    );

    capPivot.setAttribute(
        "position",
        "0 0 0"
    );


    movingLever.removeAttribute(
        "animation__pivot"
    );

    movingLever.setAttribute(
        "rotation",
        "0 0 -25"
    );


    keyPivot.removeAttribute(
        "animation__insert"
    );

    keyPivot.removeAttribute(
        "animation__turn"
    );

    keyPivot.setAttribute(
        "position",
        "0 0 0.18"
    );

    keyPivot.setAttribute(
        "rotation",
        "0 0 0"
    );


    breakerToggle.removeAttribute(
        "animation__flip"
    );

    breakerToggle.setAttribute(
        "rotation",
        "-35 0 0"
    );


    // CNC

    [
        task5Estop,
        task6Mode,
        task7CycleStart,
        task8Feed

    ].forEach(function(el) {

        el.setAttribute(
            "visible",
            "false"
        );

    });


    estopCap.removeAttribute(
        "animation__press"
    );

    estopCap.removeAttribute(
        "animation__twist"
    );

    estopCap.removeAttribute(
        "animation__recoil"
    );

    estopCap.setAttribute(
        "position",
        "0 0 0.03"
    );

    estopCap.setAttribute(
        "rotation",
        "0 0 0"
    );


    modeKnob.removeAttribute(
        "animation__turn"
    );

    modeKnob.setAttribute(
        "rotation",
        "0 0 0"
    );


    cyclestartBtn.removeAttribute(
        "animation__press"
    );

    cyclestartBtn.removeAttribute(
        "animation__release"
    );

    cyclestartBtn.removeAttribute(
        "animation__pulse"
    );

    cyclestartBtn.setAttribute(
        "position",
        "0 0 0.012"
    );

    cyclestartBtn.setAttribute(
        "scale",
        "1 1 1"
    );


    feedDial.removeAttribute(
        "animation__turn"
    );

    feedDial.setAttribute(
        "rotation",
        "0 0 -45"
    );

}


/* =========================================================
   RUN TASK
   ========================================================= */

function runTask(taskNumber) {

    if (!activeTarget) {

        status.innerText =
            "Point camera at target machine first!";

        return;
    }


    resetAllTasks();


    /* TASK 1 */

    if (taskNumber === 1) {

        status.innerText =
            "TASK 1: UNSCREW FUEL CAP";

        task1Cap.setAttribute(
            "visible",
            "true"
        );

        capPivot.setAttribute(
            "animation__rotate",
            {
                property: "rotation",
                to: "0 -1080 0",
                dur: 3000,
                easing: "easeInOutQuad"
            }
        );

        capPivot.setAttribute(
            "animation__lift",
            {
                property: "position",
                to: "0 0.18 0",
                dur: 3000,
                easing: "easeInOutQuad"
            }
        );

    }


    /* TASK 2 */

    else if (taskNumber === 2) {

        status.innerText =
            "TASK 2: ACTUATE LEVER & PIVOT";

        task2Lever.setAttribute(
            "visible",
            "true"
        );

        movingLever.setAttribute(
            "animation__pivot",
            {
                property: "rotation",
                from: "0 0 -25",
                to: "0 0 35",
                dur: 1000,
                easing: "easeInOutSine",
                loop: 3,
                dir: "alternate"
            }
        );

    }


    /* TASK 3 */

    else if (taskNumber === 3) {

        status.innerText =
            "TASK 3: INSERT & TURN STARTER KEY";

        task3Key.setAttribute(
            "visible",
            "true"
        );

        keyPivot.setAttribute(
            "animation__insert",
            {
                property: "position",
                to: "0 0 0.01",
                dur: 1200,
                easing: "easeOutQuad"
            }
        );

        const turnTimer =
            setTimeout(function() {

                keyPivot.setAttribute(
                    "animation__turn",
                    {
                        property: "rotation",
                        to: "0 0 -90",
                        dur: 1000,
                        easing: "easeInOutQuad"
                    }
                );

            }, 1200);

        activeTimers.push(turnTimer);

    }


    /* TASK 4 */

    else if (taskNumber === 4) {

        status.innerText =
            "TASK 4: FLIP CIRCUIT BREAKER ON";

        task4Breaker.setAttribute(
            "visible",
            "true"
        );

        breakerToggle.setAttribute(
            "animation__flip",
            {
                property: "rotation",
                to: "35 0 0",
                dur: 1000,
                easing: "easeInOutBack"
            }
        );

    }


    /* TASK 5 */

    else if (taskNumber === 5) {

        status.innerText =
            "TASK 5: PRESS & LOCK EMERGENCY STOP";

        task5Estop.setAttribute(
            "visible",
            "true"
        );

        estopCap.setAttribute(
            "animation__press",
            {
                property: "position",
                from: "0 0 0.03",
                to: "0 0 -0.03",
                dur: 350,
                easing: "easeInQuad"
            }
        );

        const twistTimer =
            setTimeout(function() {

                estopCap.setAttribute(
                    "animation__twist",
                    {
                        property: "rotation",
                        from: "0 0 0",
                        to: "0 0 45",
                        dur: 400,
                        easing: "easeInOutCubic"
                    }
                );

            }, 350);


        const recoilTimer =
            setTimeout(function() {

                estopCap.setAttribute(
                    "animation__recoil",
                    {
                        property: "position",
                        from: "0 0 -0.03",
                        to: "0 0 -0.015",
                        dur: 180,
                        easing: "easeOutBack"
                    }
                );

            }, 750);


        activeTimers.push(
            twistTimer,
            recoilTimer
        );

    }


    /* TASK 6 */

    else if (taskNumber === 6) {

        status.innerText =
            "TASK 6: SELECT AUTO MODE";

        task6Mode.setAttribute(
            "visible",
            "true"
        );

        modeKnob.setAttribute(
            "animation__turn",
            {
                property: "rotation",
                to: "0 0 -90",
                dur: 900,
                easing: "easeOutBack"
            }
        );

    }


    /* TASK 7 */

    else if (taskNumber === 7) {

        status.innerText =
            "TASK 7: PRESS CYCLE START";

        task7CycleStart.setAttribute(
            "visible",
            "true"
        );

        cyclestartBtn.setAttribute(
            "animation__press",
            {
                property: "position",
                from: "0 0 0.012",
                to: "0 0 -0.040",
                dur: 250,
                easing: "easeInQuad"
            }
        );


        const releaseTimer =
            setTimeout(function() {

                cyclestartBtn.setAttribute(
                    "animation__release",
                    {
                        property: "position",
                        from: "0 0 -0.040",
                        to: "0 0 0.012",
                        dur: 300,
                        easing: "easeOutBack"
                    }
                );

            }, 450);


        const scaleTimer =
            setTimeout(function() {

                cyclestartBtn.setAttribute(
                    "animation__pulse",
                    {
                        property: "scale",
                        from: "1 1 1",
                        to: "1.15 1.15 1.15",
                        dur: 200,
                        dir: "alternate",
                        loop: 2,
                        easing: "easeInOutSine"
                    }
                );

            }, 250);


        activeTimers.push(
            releaseTimer,
            scaleTimer
        );

    }


    /* TASK 8 */

    else if (taskNumber === 8) {

        status.innerText =
            "TASK 8: ADJUST FEED OVERRIDE";

        task8Feed.setAttribute(
            "visible",
            "true"
        );

        feedDial.setAttribute(
            "animation__turn",
            {
                property: "rotation",
                from: "0 0 -45",
                to: "0 0 115",
                dur: 1400,
                easing: "easeInOutCubic"
            }
        );

    }

}


/* =========================================================
   GENERATOR TARGET
   ========================================================= */

targetGen.addEventListener(
    "targetFound",
    function() {

        activeTarget = "generator";

        showButtonsForTarget(
            "generator"
        );

        status.innerText =
            "GENERATOR DETECTED: SELECT TASK";

    }
);


targetGen.addEventListener(
    "targetLost",
    function() {

        if (
            activeTarget === "generator"
        ) {

            activeTarget = null;

            showButtonsForTarget(null);

            status.innerText =
                "Point camera at target machine";

            resetAllTasks();

        }

    }
);

/* =========================================================
   START
   ========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        const sceneEl =
            document.querySelector("a-scene");


        if (!sceneEl) {

            console.error(
                "A-Frame scene not found"
            );

            return;

        }


        /*
         * MindAR must be ready before we start
         * the remote connection.
         */

        sceneEl.addEventListener(
            "arReady",
            async function() {

                console.log(
                    "MindAR AR ready"
                );


                status.innerText =
                    "Camera ready | Waiting for Expert...";


                /*
                 * Get the actual camera stream.
                 */

                const cameraReady =
                    await getCameraStream();


                if (!cameraReady) {

                    return;

                }


                /*
                 * Now start PeerJS.
                 */

                initPeer();

            }
        );

    });

</script>
