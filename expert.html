<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote Expert Console</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #090d16;
            color: #f1f5f9;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* MAIN VIDEO CANVAS CONTAINER */
        #video-container {
            flex: 1;
            background: #020617;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: inset 0 0 80px rgba(0, 0, 0, 0.8);
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 4px;
        }

        /* OVERLAY BADGES */
        .status-badge {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0.6rem 1.2rem;
            border-radius: 30px;
            color: #38bdf8;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #f59e0b;
            box-shadow: 0 0 10px #f59e0b;
        }

        .status-dot.online {
            background: #10b981;
            box-shadow: 0 0 10px #10b981;
        }

        .task-feedback {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(15, 23, 42, 0.9);
            border-left: 4px solid #38bdf8;
            padding: 0.8rem 1.2rem;
            border-radius: 6px;
            font-size: 13px;
            color: #e2e8f0;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 10;
        }

        /* SIDEBAR INTERFACE */
        #sidebar {
            width: 360px;
            background: #0f172a;
            border-left: 1px solid #1e293b;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.8rem;
            overflow-y: auto;
        }

        .brand-header {
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 1rem;
        }

        .brand-header h2 {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #f8fafc;
        }

        .section-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #64748b;
            margin-bottom: 0.8rem;
            font-weight: 700;
        }

        .task-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.6rem;
        }

        /* BUTTON DESIGN */
        .action-btn {
            background: #1e293b;
            color: #cbd5e1;
            border: 1px solid #334155;
            padding: 0.85rem 0.6rem;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* GENERATOR CONTROL STYLING */
        .gen-group .action-btn:hover {
            background: #0284c7;
            color: #ffffff;
            border-color: #38bdf8;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.25);
            transform: translateY(-2px);
        }

        /* CNC CONTROL STYLING */
        .cnc-group .action-btn:hover {
            background: #7c3aed;
            color: #ffffff;
            border-color: #a78bfa;
            box-shadow: 0 4px 12px rgba(167, 139, 250, 0.25);
            transform: translateY(-2px);
        }

        .action-btn:active {
            transform: translateY(0);
        }

        /* FOOTER BRANDING */
        .console-footer {
            margin-top: auto;
            padding-top: 1rem;
            border-top: 1px solid #1e293b;
            font-size: 11px;
            color: #475569;
            text-align: center;
        }
    </style>
</head>

<body>

    <div id="video-container">
        <div class="status-badge" id="connStatus">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">Initializing Peer Connection...</span>
        </div>
        <div class="task-feedback" id="taskFeedback">Command Executed</div>
        <video id="remoteVideo" autoplay playsinline muted></video>
    </div>

    <div id="sidebar">
        <div class="brand-header">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2">
                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
            </svg>
            <h2>Expert Operations</h2>
        </div>

        <div class="gen-group">
            <div class="section-title">Generator Controls</div>
            <div class="task-grid">
                <button class="action-btn" onclick="sendTask(1)">Fuel Cap</button>
                <button class="action-btn" onclick="sendTask(2)">Lever</button>
                <button class="action-btn" onclick="sendTask(3)">Starter Key</button>
                <button class="action-btn" onclick="sendTask(4)">Breaker</button>
            </div>
        </div>

        <div class="cnc-group">
            <div class="section-title">CNC Controls</div>
            <div class="task-grid">
                <button class="action-btn" onclick="sendTask(5)">E-Stop</button>
                <button class="action-btn" onclick="sendTask(6)">Mode Select</button>
                <button class="action-btn" onclick="sendTask(7)">Cycle Start</button>
                <button class="action-btn" onclick="sendTask(8)">Speed Override</button>
            </div>
        </div>

        <div class="console-footer">
            Remote Repair WebRTC Network • Encrypted End-to-End
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room') || 'repair-session-01';

        const expertId = roomId + '-expert';
        const techId = roomId;

        const videoEl = document.getElementById('remoteVideo');
        const statusText = document.getElementById('statusText');
        const statusDot = document.getElementById('statusDot');
        const taskFeedback = document.getElementById('taskFeedback');

        let peer = new Peer(expertId);
        let dataConn = null;

        peer.on('open', (id) => {
            statusText.innerText = `Connecting to Tech (${techId})...`;
            connectToTech();
        });

        function connectToTech() {
            dataConn = peer.connect(techId);

            dataConn.on('open', () => {
                statusText.innerText = `Connected to Field Tech`;
                statusDot.classList.add('online');
            });

            dataConn.on('close', () => {
                statusText.innerText = `Field Tech Disconnected`;
                statusDot.classList.remove('online');
                setTimeout(connectToTech, 3000); // Attempt Auto-reconnect
            });
        }

        peer.on('call', (call) => {
            call.answer();

            call.on('stream', (remoteStream) => {
                videoEl.muted = true;
                videoEl.srcObject = remoteStream;

                const playPromise = videoEl.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        statusText.innerText = `Streaming Live HD Video`;
                        statusDot.classList.add('online');
                    }).catch(() => {
                        statusText.innerText = `Click viewport to enable video`;
                        document.body.addEventListener('click', () => {
                            videoEl.play();
                            statusText.innerText = `Streaming Live HD Video`;
                            statusDot.classList.add('online');
                        }, { once: true });
                    });
                }
            });
        });

        function sendTask(taskNum) {
            if (dataConn && dataConn.open) {
                dataConn.send({ type: 'RUN_TASK', taskNum: taskNum });
                
                // Show floating command feedback
                taskFeedback.innerText = `Triggered Action Task #${taskNum}`;
                taskFeedback.style.opacity = '1';
                setTimeout(() => { taskFeedback.style.opacity = '0'; }, 2000);
            } else {
                alert("Field Technician connection is currently offline!");
            }
        }
    </script>

</body>

</html>
