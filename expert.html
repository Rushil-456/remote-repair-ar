<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote Expert Console</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a; color: #f8fafc;
            display: flex; height: 100vh; overflow: hidden;
        }
        #video-container {
            flex: 1; background: #000; display: flex;
            justify-content: center; align-items: center; position: relative;
        }
        video { width: 100%; height: 100%; object-fit: contain; background: #000; }
        #sidebar {
            width: 360px; background: #1e293b;
            border-left: 1px solid #334155; padding: 1.5rem;
            display: flex; flex-direction: column; gap: 1.5rem;
            overflow-y: auto;
        }
        h2 { color: #f59e0b; font-size: 1.25rem; }
        h3 { color: #94a3b8; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem; }
        .task-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
        .action-btn {
            background: #334155; color: #f8fafc; border: 1px solid #475569;
            padding: 0.75rem; border-radius: 8px; font-weight: 600;
            cursor: pointer; transition: all 0.2s; text-align: center;
        }
        .action-btn:hover { background: #f59e0b; color: #0f172a; }
        .status-badge {
            position: absolute; top: 15px; left: 15px;
            background: rgba(15, 23, 42, 0.85); padding: 0.5rem 1rem;
            border-radius: 20px; border: 1px solid #334155;
            font-size: 0.85rem; color: #10b981; font-weight: 600; z-index: 10;
        }
    </style>
</head>
<body>

<div id="video-container">
    <div class="status-badge" id="connStatus">Status: Connecting...</div>
    <video id="remoteVideo" autoplay playsinline muted></video>
</div>

<div id="sidebar">
    <div>
        <h2>Remote Repair Expert</h2>
        <p style="font-size: 0.8rem; color: #64748b;">Live Field Guidance Session</p>
    </div>

    <div>
        <h3>Generator Controls</h3>
        <div class="task-grid">
            <button class="action-btn" onclick="sendTask(1)">1. Fuel Cap</button>
            <button class="action-btn" onclick="sendTask(2)">2. Lever</button>
            <button class="action-btn" onclick="sendTask(3)">3. Key</button>
            <button class="action-btn" onclick="sendTask(4)">4. Breaker</button>
        </div>
    </div>

    <div>
        <h3>CNC Machine Controls</h3>
        <div class="task-grid">
            <button class="action-btn" onclick="sendTask(5)">5. E-Stop</button>
            <button class="action-btn" onclick="sendTask(6)">6. Mode</button>
            <button class="action-btn" onclick="sendTask(7)">7. Cycle Start</button>
            <button class="action-btn" onclick="sendTask(8)">8. Feed Dial</button>
        </div>
    </div>
</div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const roomId = urlParams.get('room') || 'repair-session-01';

let peer = new Peer();
let dataConn = null;

peer.on('open', (expertId) => {
    document.getElementById('connStatus').innerText = `Connecting to room: ${roomId}...`;

    // Connect Data Channel
    dataConn = peer.connect(roomId);
    
    dataConn.on('open', () => {
        document.getElementById('connStatus').innerText = `Status: Connected to Field Tech`;
    });

    dataConn.on('error', (err) => {
        document.getElementById('connStatus').innerText = `Data Connection Failed!`;
    });

    // Place video call to Technician
    setTimeout(() => {
        const call = peer.call(roomId, null);
        if (call) {
            call.on('stream', (remoteStream) => {
                const videoEl = document.getElementById('remoteVideo');
                videoEl.srcObject = remoteStream;
                videoEl.onloadedmetadata = () => {
                    videoEl.play().catch(e => console.error("Playback error:", e));
                };
            });
        }
    }, 1200);
});

function sendTask(taskNum) {
    if (dataConn && dataConn.open) {
        dataConn.send({ type: 'RUN_TASK', taskNum: taskNum });
    } else {
        alert("Not connected to Field Technician session!");
    }
}
</script>

</body>
</html>
