<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote Repair Expert Dashboard</title>
    <style>
        body {
            margin: 0; background: #121212; color: #fff;
            font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center;
        }
        header {
            width: 100%; padding: 15px; background: #1f1f1f; text-align: center;
            font-size: 20px; font-weight: bold; border-bottom: 2px solid #333;
            display: flex; justify-content: space-between; align-items: center;
            box-sizing: border-box; padding: 15px 30px;
        }
        .back-btn {
            background: #333; color: #ffcc00; border: 1px solid #ffcc00;
            padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: bold;
        }
        #video-container {
            margin-top: 20px; width: 90%; max-width: 1000px; height: 550px;
            background: #000; border: 2px solid #ffcc00; border-radius: 8px; overflow: hidden;
        }
        video { width: 100%; height: 100%; object-fit: contain; }
    </style>
</head>
<body>

<header>
    <span>Remote Repair Expert - Live Feed</span>
    <button class="back-btn" onclick="window.location.href='index.html'">← Back to Portal</button>
</header>

<div id="video-container">
    <video id="remoteVideo" autoplay playsinline controls></video>
</div>

<script>
    const ws = new WebSocket('ws://localhost:8080');
    let peerConnection;
    const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

    ws.onopen = () => {
        ws.send(JSON.stringify({ type: 'register-expert' }));
    };

    ws.onmessage = async (event) => {
        const data = JSON.parse(event.data);

        if (data.type === 'offer') {
            peerConnection = new RTCPeerConnection(rtcConfig);

            peerConnection.ontrack = (e) => {
                document.getElementById('remoteVideo').srcObject = e.streams[0];
            };

            peerConnection.onicecandidate = (e) => {
                if (e.candidate) {
                    ws.send(JSON.stringify({ type: 'candidate-from-expert', candidate: e.candidate }));
                }
            };

            await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);

            ws.send(JSON.stringify({ type: 'answer', answer: answer }));
        } else if (data.type === 'candidate-from-tech') {
            if (peerConnection) {
                await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
            }
        }
    };
</script>
</body>
</html>
