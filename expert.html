<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote Expert Console</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            background: #0f172a; color: #f8fafc;
            display: flex; height: 100vh; overflow: hidden;
        }
        #video-container {
            flex: 1; background: #000; display: flex;
            justify-content: center; align-items: center; position: relative;
        }
        video { width: 100%; height: 100%; object-fit: contain; }
        #sidebar {
            width: 320px; background: #1e293b;
            border-left: 1px solid #334155; padding: 1.5rem;
            display: flex; flex-direction: column; gap: 1.5rem;
        }
        .task-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
        .action-btn {
            background: #334155; color: #f8fafc; border: 1px solid #475569;
            padding: 0.75rem; border-radius: 8px; font-weight: bold;
            cursor: pointer; text-align: center;
        }
        .action-btn:hover { background: #ffcc00; color: #000; }
        .status-badge {
            position: absolute; top: 15px; left: 15px;
            background: rgba(0, 0, 0, 0.8); padding: 0.5rem 1rem;
            border-radius: 20px; color: #10b981; font-weight: bold; z-index: 10;
        }
    </style>
</head>
<body>

<div id="video-container">
    <div class="status-badge" id="connStatus">Connecting...</div>
    <video id="remoteVideo" autoplay playsinline muted></video>
</div>

<div id="sidebar">
    <h2>Remote Repair Expert</h2>
    
    <div>
        <h3>Generator Controls</h3>
        <div class="task-grid">
            <button class="action-btn" onclick="sendTask(1)">Task 1</button>
            <button class="action-btn" onclick="sendTask(2)">Task 2</button>
            <button class="action-btn" onclick="sendTask(3)">Task 3</button>
            <button class="action-btn" onclick="sendTask(4)">Task 4</button>
        </div>
    </div>

    <div>
        <h3>CNC Machine Controls</h3>
        <div class="task-grid">
            <button class="action-btn" onclick="sendTask(5)">Task 5</button>
            <button class="action-btn" onclick="sendTask(6)">Task 6</button>
            <button class="action-btn" onclick="sendTask(7)">Task 7</button>
            <button class="action-btn" onclick="sendTask(8)">Task 8</button>
        </div>
    </div>
</div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const roomId = urlParams.get('room') || 'repair-session-01';

const expertId = roomId + '-expert';
const techId = roomId; 

let peer = new Peer(expertId);
let dataConn = null;

peer.on('open', (id) => {
    document.getElementById('connStatus').innerText = `Connecting to Field Tech (${techId})...`;

    dataConn = peer.connect(techId);
    
    dataConn.on('open', () => {
        document.getElementById('connStatus').innerText = `Status: Connected to Field Tech`;
    });

    dataConn.on('close', () => {
        document.getElementById('connStatus').innerText = `Status: Disconnected`;
    });
});

peer.on('call', (call) => {
    call.answer();
    
    call.on('stream', (remoteStream) => {
        const videoEl = document.getElementById('remoteVideo');
        videoEl.srcObject = remoteStream;
        videoEl.play().catch(console.error);
        document.getElementById('connStatus').innerText = `Status: Streaming Live Video`;
    });
});

function sendTask(taskNum) {
    if (dataConn && dataConn.open) {
        dataConn.send({ type: 'RUN_TASK', taskNum: taskNum });
    } else {
        alert("Not connected to Field Technician session!");
    }
}
</script>

</body>
</html>
