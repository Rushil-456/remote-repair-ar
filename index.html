<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote Repair AR Portal</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
        }

        /* ROLE SELECTION OVERLAY */
        #role-select-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #181818;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        #role-select-overlay h1 {
            font-size: 24px;
            margin-bottom: 8px;
            color: #ffcc00;
        }

        #role-select-overlay p {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 30px;
        }

        .portal-btn {
            width: 240px;
            padding: 16px;
            margin: 10px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            border: 2px solid #ffcc00;
            background: #222;
            color: #ffcc00;
            cursor: pointer;
            transition: 0.2s;
        }

        .portal-btn:hover, .portal-btn:active {
            background: #ffcc00;
            color: #000;
        }

        /* AR UI ELEMENTS */
        #status {
            position: fixed;
            top: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 0 2px 5px black;
            z-index: 100;
            display: none;
        }

        #controls {
            position: fixed;
            bottom: 25px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 12px;
            z-index: 100;
            padding: 0 10px;
            box-sizing: border-box;
        }

        .btn {
            background: rgba(0, 0, 0, 0.85);
            color: #ffcc00;
            border: 2px solid #ffcc00;
            padding: 12px 18px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            display: none;
        }

        .a-enter-vr { display: none !important; }
    </style>
</head>

<body>

<!-- ROLE SELECTION MENU -->
<div id="role-select-overlay">
    <h1>Remote Repair System</h1>
    <p>Select your operational role to proceed</p>
    <button class="portal-btn" onclick="startTechnicianMode()">Field Technician</button>
    <button class="portal-btn" onclick="openExpertMode()">Remote Expert</button>
</div>

<!-- AR HUD STATUS & BUTTONS -->
<div id="status">Point camera at target machine</div>

<div id="controls">
    <button id="btn-t1" class="btn" onclick="runTask(1)">Task 1</button>
    <button id="btn-t2" class="btn" onclick="runTask(2)">Task 2</button>
    <button id="btn-t3" class="btn" onclick="runTask(3)">Task 3</button>
    <button id="btn-t4" class="btn" onclick="runTask(4)">Task 4</button>
    <button id="btn-t5" class="btn" onclick="runTask(5)">Task 5</button>
    <button id="btn-t6" class="btn" onclick="runTask(6)">Task 6</button>
    <button id="btn-t7" class="btn" onclick="runTask(7)">Task 7</button>
    <button id="btn-t8" class="btn" onclick="runTask(8)">Task 8</button>
</div>

<!-- A-FRAME AR SCENE -->
<a-scene id="ar-scene"
    mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 2; autoStart: false;"
    embedded
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    renderer="colorManagement: true; precision: highp; antialias: true;">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-light type="ambient" color="#ffffff" intensity="2.0"></a-light>
    <a-light type="directional" position="1 2 2" intensity="1.5"></a-light>

    <!-- GENERATOR TARGET -->
    <a-entity id="generator-target" mindar-image-target="targetIndex: 0">
        <a-entity id="task1-cap" position="-0.18 0.30 0.02" scale="0.65 0.65 0.65" visible="false">
            <a-cylinder position="0 0 0" radius="0.065" height="0.025" color="#ffcc00"></a-cylinder>
        </a-entity>
    </a-entity>

    <!-- CNC TARGET -->
    <a-entity id="cnc-target" mindar-image-target="targetIndex: 1">
        <a-entity id="task5-estop" position="-0.32 -0.15 0.08" scale="0.95 0.95 0.95" visible="false">
            <a-cylinder position="0 0 0" radius="0.058" height="0.012" color="#ffcc00"></a-cylinder>
        </a-entity>
    </a-entity>
</a-scene>

<script>
let ws, peerConnection;
const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

function openExpertMode() {
    window.location.href = "expert.html";
}

function startTechnicianMode() {
    document.getElementById("role-select-overlay").style.display = "none";
    document.getElementById("status").style.display = "block";

    // Start MindAR Engine
    const sceneEl = document.querySelector('a-scene');
    sceneEl.systems['mindar-image-system'].start();

    // Connect to WebRTC Signaling Server
    initSignaling();
}

function initSignaling() {
    ws = new WebSocket('ws://localhost:8080');

    ws.onopen = () => {
        ws.send(JSON.stringify({ type: 'register-technician' }));
        initARStream();
    };

    ws.onmessage = async (event) => {
        const data = JSON.parse(event.data);
        if (data.type === 'answer') {
            await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
        } else if (data.type === 'candidate-from-expert') {
            await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
        }
    };
}

async function initARStream() {
    peerConnection = new RTCPeerConnection(rtcConfig);

    peerConnection.onicecandidate = (e) => {
        if (e.candidate) {
            ws.send(JSON.stringify({ type: 'candidate-from-tech', candidate: e.candidate }));
        }
    };

    // Grab WebGL stream from A-Frame AR canvas
    const canvas = document.querySelector('canvas');
    if (canvas) {
        const stream = canvas.captureStream(30);
        stream.getTracks().forEach(track => peerConnection.addTrack(track, stream));

        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);
        ws.send(JSON.stringify({ type: 'offer', offer: offer }));
    }
}

function runTask(taskNumber) {
    document.getElementById("status").innerText = `TASK ${taskNumber} ACTIVE`;
}
</script>

</body>
</html>
