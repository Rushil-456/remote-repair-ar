<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Generator AR</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    #status {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;

      padding: 10px 15px;

      background: rgba(0,0,0,0.75);
      color: white;

      font-family: Arial;
      font-size: 14px;

      border-radius: 8px;
    }
  </style>
</head>

<body>

<div id="status">POINT CAMERA AT GENERATOR</div>

<a-scene
  embedded
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"

  mindar-image="
    imageTargetSrc: ./targets.mind;
    maxTrack: 1;
  "

  renderer="
    colorManagement: true;
    physicallyCorrectLights: true;
  "
>


  <!-- CAMERA -->

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>


  <!-- LIGHTING -->

  <a-light
    type="ambient"
    intensity="2">
  </a-light>

  <a-light
    type="directional"
    position="1 2 1"
    intensity="2">
  </a-light>


  <!-- IMAGE TARGET -->

  <a-entity
    id="target"
    mindar-image-target="targetIndex: 0">


    <!-- ================================= -->
    <!-- 3D LEVER -->
    <!-- ================================= -->

    <a-entity
      id="leverAssembly"
      position="0.16 -0.18 0.12"
      scale="0.8 0.8 0.8">


      <!-- BASE -->

      <a-box
        position="0 0 0"
        width="0.22"
        height="0.08"
        depth="0.06">
      </a-box>


      <!-- PIVOT -->

      <a-cylinder
        position="0 0 0.04"
        radius="0.04"
        height="0.07"
        rotation="90 0 0">
      </a-cylinder>


      <!-- MOVING PART -->

      <a-entity
        id="lever">


        <!-- LEVER ARM -->

        <a-box
          position="0 0.10 0"
          width="0.04"
          height="0.20"
          depth="0.04">
        </a-box>


        <!-- HANDLE -->

        <a-cylinder
          position="0 0.21 0"
          radius="0.045"
          height="0.08"
          rotation="90 0 0">
        </a-cylinder>


        <!-- END -->

        <a-sphere
          position="0 0.25 0"
          radius="0.045">
        </a-sphere>


      </a-entity>

    </a-entity>

  </a-entity>

</a-scene>


<script>

const target = document.querySelector("#target");

const lever = document.querySelector("#lever");

const status = document.querySelector("#status");


// ========================================
// GENERATOR DETECTED
// ========================================

target.addEventListener("targetFound", function () {

  console.log("GENERATOR DETECTED");

  status.innerText = "3D REPAIR ACTION";


  // Reset lever

  lever.setAttribute(
    "rotation",
    "0 0 -30"
  );


  // Wait one second

  setTimeout(function () {

    moveLever();

  }, 1000);

});


// ========================================
// MOVE LEVER
// ========================================

function moveLever() {

  console.log("MOVING LEVER");

  status.innerText = "MOVING 3D COMPONENT";


  lever.setAttribute(
    "animation",
    {
      property: "rotation",

      from: "0 0 -30",

      to: "0 0 30",

      dur: 1500,

      easing: "easeInOutSine",

      loop: false
    }
  );

}


// ========================================
// ANIMATION FINISHED
// ========================================

lever.addEventListener(
  "animationcomplete",
  function () {

    console.log("LEVER ACTION COMPLETE");

    status.innerText = "ACTION COMPLETE";

  }
);


// ========================================
// TARGET LOST
// ========================================

target.addEventListener("targetLost", function () {

  console.log("GENERATOR LOST");

  status.innerText = "POINT CAMERA AT GENERATOR";

});

</script>

</body>
</html>
