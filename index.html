<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Remote Repair AR</title>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
        }

        #status {
            position: fixed;
            top: 20px;
            width: 100%;
            text-align: center;
            color: white;
            font-family: Arial;
            font-size: 18px;
            z-index: 10;
            text-shadow: 0 2px 5px black;
        }
    </style>
</head>

<body>

<div id="status">Starting camera...</div>

<a-scene
    mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 1;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera
        position="0 0 0"
        look-controls="enabled: false">
    </a-camera>

    <a-entity
        id="generator-target"
        mindar-image-target="targetIndex: 0">

        <!-- Simple test AR marker -->
        <a-ring
            position="-0.12 0.25 0.05"
            radius-inner="0.08"
            radius-outer="0.10"
            color="lime"
            opacity="0.9">

            <a-animation
                attribute="rotation"
                to="0 0 360"
                dur="1500"
                easing="linear"
                repeat="indefinite">
            </a-animation>

        </a-ring>

    </a-entity>

</a-scene>

<script>

const target = document.querySelector("#generator-target");
const status = document.querySelector("#status");

target.addEventListener("targetFound", () => {
    status.innerText = "GENERATOR DETECTED";
});

target.addEventListener("targetLost", () => {
    status.innerText = "Point camera at generator";
});

</script>

</body>
</html>
