<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Multi-Machine AR Assistant — Improved</title>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }

        /*
         * IMPORTANT:
         * Do NOT force every <video> element to 100vw/100vh.
         * MindAR owns the camera video element and its aspect ratio.
         * The previous CSS could stretch/crop the camera independently
         * from the AR canvas, which is a common cause of bad alignment.
         */
        video {
            max-width: none !important;
        }

        .a-canvas {
            position: fixed !important;
            inset: 0 !important;
            width: 100% !important;
            height: 100% !important;
            z-index: 2 !important;
            background: transparent !important;
        }

        #status {
            position: fixed;
            top: max(18px, env(safe-area-inset-top));
            left: 50%;
            transform: translateX(-50%);
            width: min(94vw, 560px);
            padding: 10px 14px;
            text-align: center;
            color: #fff;
            background: rgba(0,0,0,.58);
            border: 1px solid rgba(255,204,0,.55);
            border-radius: 12px;
            font-size: clamp(12px, 2.8vw, 15px);
            font-weight: 700;
            text-shadow: 0 2px 5px #000;
            z-index: 100;
            backdrop-filter: blur(5px);
        }

        #hint {
            position: fixed;
            left: 50%;
            bottom: 88px;
            transform: translateX(-50%);
            width: min(90vw, 460px);
            padding: 8px 12px;
            color: #fff;
            text-align: center;
            font-size: 12px;
            background: rgba(0,0,0,.45);
            border-radius: 10px;
            z-index: 100;
            pointer-events: none;
        }

        #controls {
            position: fixed;
            left: 50%;
            bottom: max(18px, env(safe-area-inset-bottom));
            transform: translateX(-50%);
            width: min(96vw, 560px);
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 7px;
            z-index: 100;
        }

        .btn {
            min-height: 46px;
            padding: 8px 5px;
            background: rgba(10,10,10,.88);
            color: #ffcc00;
            border: 1.5px solid #ffcc00;
            font-size: clamp(9px, 2.5vw, 12px);
            font-weight: 700;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,.5);
            touch-action: manipulation;
        }

        .btn:active {
            background: #ffcc00;
            color: #000;
            transform: scale(.97);
        }

        .a-enter-vr { display: none !important; }

        /* Avoid accidental selection while using the AR UI */
        button, #status, #hint { user-select: none; }
    </style>
</head>

<body>

<div id="status">Scanning for machine targets...</div>
<div id="hint">Move the phone slowly until the machine target is recognized.</div>

<div id="controls">
    <button class="btn" id="btn1" onclick="runTask(1)">Part 1</button>
    <button class="btn" id="btn2" onclick="runTask(2)">Part 2</button>
    <button class="btn" id="btn3" onclick="runTask(3)">Part 3</button>
    <button class="btn" id="btn4" onclick="runTask(4)">Part 4</button>
</div>

<a-scene
    mindar-image="
        imageTargetSrc: ./targets.mind;
        maxTrack: 1;
        filterMinCF: 0.0001;
        filterBeta: 0.001;
        warmupTolerance: 5;
        missTolerance: 10;
        videoSettings: {
            facingMode: 'environment';
            width: {ideal: 1920, min: 1280};
            height: {ideal: 1080, min: 720};
        };
    "
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    renderer="
        colorManagement: true;
        precision: highp;
        antialias: true;
        alpha: true;
        preserveDrawingBuffer: false;
    ">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Soft lighting for virtual objects -->
    <a-light type="ambient" color="#ffffff" intensity="2.2"></a-light>
    <a-light type="directional" position="2 4 3" intensity="1.6"></a-light>
    <a-light type="directional" position="-2 1 2" intensity="0.7"></a-light>

    <!-- =========================================================
         GENERATOR TARGET
         Coordinates are grouped so they are easy to tune.
         ========================================================= -->
    <a-entity id="target-generator" mindar-image-target="targetIndex: 0">

        <!-- Fuel cap -->
        <a-entity id="gen-task1"
                  position="0.00 0.32 0.035"
                  scale=".62 .62 .62"
                  visible="false">

            <a-cylinder radius=".078" height=".018" color="#111"
                         position="0 0 0"></a-cylinder>

            <a-entity id="gen-cap-pivot" position="0 0 0">
                <a-cylinder radius=".070" height=".034"
                             color="#ff9f00"
                             metalness=".75"
                             roughness=".25"></a-cylinder>

                <a-box position="0 .021 0"
                       width=".115" height=".014" depth=".028"
                       color="#222"></a-box>

                <!-- floating arrow -->
                <a-entity class="action-arrow"
                          position="0 .13 .015"
                          rotation="0 0 0">
                    <a-cone radius-bottom=".035"
                            radius-top="0"
                            height=".075"
                            color="#ffcc00"
                            position="0 -.035 0"></a-cone>
                    <a-cylinder radius=".010"
                                height=".085"
                                color="#ffcc00"
                                position="0 .035 0"></a-cylinder>
                </a-entity>
            </a-entity>

            <a-torus radius=".11" radius-tubular=".006"
                     color="#ffcc00"
                     position="0 0 .025"
                     rotation="0 0 0"
                     animation="property: rotation; to: 0 360 0; dur: 1800; loop: true; easing: linear">
            </a-torus>
        </a-entity>

        <!-- Throttle -->
        <a-entity id="gen-task2"
                  position=".22 -.05 .035"
                  scale=".72 .72 .72"
                  visible="false">

            <a-box width=".095" height=".085" depth=".025"
                   color="#222"></a-box>

            <a-cylinder radius=".032" height=".023"
                         position="0 0 .018"
                         rotation="90 0 0"
                         color="#888"
                         metalness=".8"></a-cylinder>

            <a-entity id="gen-lever-pivot"
                      position="0 0 .025"
                      rotation="0 0 -25">
                <a-box position="0 .075 0"
                       width=".020" height=".15" depth=".020"
                       color="#ddd"
                       metalness=".9"></a-box>
                <a-sphere position="0 .155 0"
                          radius=".032"
                          color="#d32f2f"
                          roughness=".2"></a-sphere>
            </a-entity>

            <a-cone radius-bottom=".035"
                    radius-top="0"
                    height=".08"
                    color="#ffcc00"
                    position=".10 .09 .01"
                    rotation="0 0 -90"></a-cone>
        </a-entity>

        <!-- Ignition -->
        <a-entity id="gen-task3"
                  position="-.22 -.05 .035"
                  scale=".82 .82 .82"
                  visible="false">

            <a-cylinder radius=".042" height=".012"
                         rotation="90 0 0"
                         color="#333"></a-cylinder>

            <a-ring radius-inner=".021"
                    radius-outer=".040"
                    position="0 0 .008"
                    color="#ffcc00"></a-ring>

            <a-entity id="gen-key-pivot"
                      position="0 0 .18">
                <a-box position="0 0 -.055"
                       width=".008" height=".017" depth=".11"
                       color="#ccc"
                       metalness=".95"></a-box>
                <a-cylinder position="0 0 .01"
                             radius=".029" height=".009"
                             rotation="90 0 0"
                             color="#ff9800"></a-cylinder>
            </a-entity>

            <a-cone radius-bottom=".034"
                    radius-top="0"
                    height=".075"
                    color="#ffcc00"
                    position=".10 .06 .02"
                    rotation="0 0 -90"></a-cone>
        </a-entity>

        <!-- Breaker -->
        <a-entity id="gen-task4"
                  position="0 -.15 .035"
                  visible="false">

            <a-box width=".065" height=".095" depth=".025"
                   color="#1e1e1e"></a-box>

            <a-entity id="gen-breaker-toggle"
                      position="0 -.015 .022"
                      rotation="-35 0 0">
                <a-box position="0 .020 .010"
                       width=".022" height=".040" depth=".022"
                       color="#ffb300"
                       metalness=".4"></a-box>
            </a-entity>

            <a-cone radius-bottom=".035"
                    radius-top="0"
                    height=".075"
                    color="#ffcc00"
                    position=".10 0 .02"
                    rotation="0 0 -90"></a-cone>
        </a-entity>

    </a-entity>

    <!-- =========================================================
         FANUC TARGET
         ========================================================= -->
    <a-entity id="target-fanuc" mindar-image-target="targetIndex: 1">

        <!-- E-stop -->
        <a-entity id="cnc-task1"
                  position="-.28 -.18 .035"
                  scale=".82 .82 .82"
                  visible="false">

            <a-cylinder radius=".063" height=".017"
                         rotation="90 0 0"
                         color="#ffeb3b"></a-cylinder>

            <a-entity id="cnc-estop-knob">
                <a-cylinder radius=".049" height=".038"
                             rotation="90 0 0"
                             color="#d32f2f"
                             metalness=".2"></a-cylinder>
                <a-torus radius=".051"
                         radius-tubular=".005"
                         color="#b71c1c"></a-torus>
            </a-entity>

            <a-cone radius-bottom=".035"
                    radius-top="0"
                    height=".075"
                    color="#ffcc00"
                    position=".11 .01 .02"
                    rotation="0 0 -90"></a-cone>
        </a-entity>

        <!-- Mode dial -->
        <a-entity id="cnc-task2"
                  position="-.10 -.18 .035"
                  scale=".82 .82 .82"
                  visible="false">

            <a-cylinder radius=".047" height=".012"
                         rotation="90 0 0"
                         color="#111"></a-cylinder>

            <a-entity id="cnc-mode-knob" rotation="0 0 -45">
                <a-cylinder radius=".033" height=".032"
                             rotation="90 0 0"
                             color="#222"
                             metalness=".5"></a-cylinder>
                <a-box position="0 .022 .019"
                       width=".009" height=".040" depth=".013"
                       color="#fff"></a-box>
            </a-entity>

            <a-torus radius=".070"
                     radius-tubular=".004"
                     color="#ffcc00"
                     position="0 0 .022"></a-torus>
        </a-entity>

        <!-- Spindle -->
        <a-entity id="cnc-task3"
                  position=".10 -.18 .035"
                  scale=".82 .82 .82"
                  visible="false">

            <a-cylinder radius=".047" height=".012"
                         rotation="90 0 0"
                         color="#111"></a-cylinder>

            <a-entity id="cnc-spindle-knob">
                <a-cylinder radius=".033" height=".032"
                             rotation="90 0 0"
                             color="#222"
                             metalness=".5"></a-cylinder>
                <a-box position="0 .022 .019"
                       width=".009" height=".040" depth=".013"
                       color="#00e676"></a-box>
            </a-entity>

            <a-cone radius-bottom=".035"
                    radius-top="0"
                    height=".075"
                    color="#ffcc00"
                    position=".10 .01 .02"
                    rotation="0 0 -90"></a-cone>
        </a-entity>

        <!-- Cycle start -->
        <a-entity id="cnc-task4"
                  position="-.28 -.32 .035"
                  scale=".82 .82 .82"
                  visible="false">

            <a-box width=".070" height=".070" depth=".017"
                   color="#222"></a-box>

            <a-entity id="cnc-start-btn" position="0 0 .012">
                <a-cylinder radius=".027" height=".022"
                             rotation="90 0 0"
                             color="#2ecc71"
                             metalness=".3"></a-cylinder>
            </a-entity>

            <a-ring radius-inner=".034"
                    radius-outer=".045"
                    color="#ffcc00"
                    position="0 0 .023"></a-ring>
        </a-entity>

    </a-entity>

</a-scene>

<script>
const status = document.querySelector("#status");
const hint = document.querySelector("#hint");

const targetGen = document.querySelector("#target-generator");
const targetFanuc = document.querySelector("#target-fanuc");

const btn1 = document.querySelector("#btn1");
const btn2 = document.querySelector("#btn2");
const btn3 = document.querySelector("#btn3");
const btn4 = document.querySelector("#btn4");

let activeTargetIndex = -1;
let currentTask = 0;

/* ============================================================
   UI
   ============================================================ */
function updateUI() {
    if (activeTargetIndex === 0) {
        btn1.innerText = "Fuel Cap";
        btn2.innerText = "Throttle";
        btn3.innerText = "Key Switch";
        btn4.innerText = "Breaker";
        status.innerText = "GENERATOR DETECTED — SELECT COMPONENT";
        hint.innerText = "Keep the target visible while following the AR instruction.";
    } else if (activeTargetIndex === 1) {
        btn1.innerText = "E-Stop";
        btn2.innerText = "Mode Dial";
        btn3.innerText = "Spindle Speed";
        btn4.innerText = "Cycle Start";
        status.innerText = "FANUC CNC DETECTED — SELECT COMPONENT";
        hint.innerText = "Keep the target visible while following the AR instruction.";
    } else {
        btn1.innerText = "Part 1";
        btn2.innerText = "Part 2";
        btn3.innerText = "Part 3";
        btn4.innerText = "Part 4";
        status.innerText = "Point camera at generator or CNC panel";
        hint.innerText = "Move the phone slowly until the machine target is recognized.";
    }
}

/* ============================================================
   RESET
   ============================================================ */
function stopAllAnimations() {
    const animElements = [
        "#gen-cap-pivot",
        "#gen-lever-pivot",
        "#gen-key-pivot",
        "#gen-breaker-toggle",
        "#cnc-estop-knob",
        "#cnc-mode-knob",
        "#cnc-spindle-knob",
        "#cnc-start-btn"
    ];

    animElements.forEach(selector => {
        const el = document.querySelector(selector);
        if (el) {
            el.removeAttribute("animation");
            el.removeAttribute("animation__2");
        }
    });

    const set = (selector, prop, value) => {
        const el = document.querySelector(selector);
        if (el) el.setAttribute(prop, value);
    };

    set("#gen-cap-pivot", "rotation", "0 0 0");
    set("#gen-cap-pivot", "position", "0 0 0");

    set("#gen-lever-pivot", "rotation", "0 0 -25");

    set("#gen-key-pivot", "position", "0 0 0.18");
    set("#gen-key-pivot", "rotation", "0 0 0");

    set("#gen-breaker-toggle", "rotation", "-35 0 0");

    set("#cnc-estop-knob", "rotation", "0 0 0");
    set("#cnc-estop-knob", "position", "0 0 0");

    set("#cnc-mode-knob", "rotation", "0 0 -45");
    set("#cnc-spindle-knob", "rotation", "0 0 0");
    set("#cnc-start-btn", "position", "0 0 0.012");
}

function hideAllTaskModels() {
    stopAllAnimations();

    [
        "gen-task1", "gen-task2", "gen-task3", "gen-task4",
        "cnc-task1", "cnc-task2", "cnc-task3", "cnc-task4"
    ].forEach(id => {
        const el = document.querySelector("#" + id);
        if (el) el.setAttribute("visible", "false");
    });

    currentTask = 0;
}

/* ============================================================
   TASKS
   ============================================================ */
function runTask(taskNum) {
    if (activeTargetIndex === -1) {
        status.innerText = "Please point camera at a valid machine target first!";
        return;
    }

    hideAllTaskModels();
    currentTask = taskNum;

    if (activeTargetIndex === 0) {
        /* GENERATOR */
        if (taskNum === 1) {
            status.innerText = "ACTION: UNSCREW FUEL CAP";
            const task = document.querySelector("#gen-task1");
            const pivot = document.querySelector("#gen-cap-pivot");
            task.setAttribute("visible", "true");

            pivot.setAttribute("animation", {
                property: "rotation",
                from: "0 0 0",
                to: "0 -720 0",
                dur: 1800,
                easing: "easeInOutQuad"
            });

            pivot.setAttribute("animation__2", {
                property: "position",
                from: "0 0 0",
                to: "0 0.13 0",
                dur: 1800,
                easing: "easeInOutQuad"
            });

        } else if (taskNum === 2) {
            status.innerText = "ACTION: ACTUATE THROTTLE LEVER";
            const task = document.querySelector("#gen-task2");
            const lever = document.querySelector("#gen-lever-pivot");
            task.setAttribute("visible", "true");

            lever.setAttribute("animation", {
                property: "rotation",
                from: "0 0 -25",
                to: "0 0 35",
                dur: 750,
                dir: "alternate",
                loop: 2,
                easing: "easeInOutSine"
            });

        } else if (taskNum === 3) {
            status.innerText = "ACTION: INSERT & TURN IGNITION KEY";
            const task = document.querySelector("#gen-task3");
            const key = document.querySelector("#gen-key-pivot");
            task.setAttribute("visible", "true");

            key.setAttribute("animation", {
                property: "position",
                from: "0 0 0.18",
                to: "0 0 0.02",
                dur: 800,
                easing: "easeOutQuad"
            });

            setTimeout(() => {
                if (currentTask !== 3 || activeTargetIndex !== 0) return;

                key.setAttribute("animation__2", {
                    property: "rotation",
                    from: "0 0 0",
                    to: "0 0 -90",
                    dur: 800,
                    easing: "easeInOutQuad"
                });
            }, 850);

        } else if (taskNum === 4) {
            status.innerText = "ACTION: FLIP BREAKER SWITCH";
            const task = document.querySelector("#gen-task4");
            const breaker = document.querySelector("#gen-breaker-toggle");
            task.setAttribute("visible", "true");

            breaker.setAttribute("animation", {
                property: "rotation",
                from: "-35 0 0",
                to: "35 0 0",
                dur: 700,
                easing: "easeInOutBack"
            });
        }

    } else if (activeTargetIndex === 1) {
        /* FANUC */
        if (taskNum === 1) {
            status.innerText = "ACTION: TWIST & RELEASE E-STOP";
            const task = document.querySelector("#cnc-task1");
            const knob = document.querySelector("#cnc-estop-knob");
            task.setAttribute("visible", "true");

            knob.setAttribute("animation", {
                property: "rotation",
                from: "0 0 0",
                to: "0 0 60",
                dur: 800,
                easing: "easeOutBack"
            });

            knob.setAttribute("animation__2", {
                property: "position",
                from: "0 0 0",
                to: "0 0 0.045",
                dur: 800,
                easing: "easeOutBack"
            });

        } else if (taskNum === 2) {
            status.innerText = "ACTION: SELECT AUTO MODE";
            const task = document.querySelector("#cnc-task2");
            const knob = document.querySelector("#cnc-mode-knob");
            task.setAttribute("visible", "true");

            knob.setAttribute("animation", {
                property: "rotation",
                from: "0 0 -45",
                to: "0 0 45",
                dur: 1000,
                easing: "easeInOutQuad"
            });

        } else if (taskNum === 3) {
            status.innerText = "ACTION: ADJUST SPINDLE SPEED";
            const task = document.querySelector("#cnc-task3");
            const knob = document.querySelector("#cnc-spindle-knob");
            task.setAttribute("visible", "true");

            knob.setAttribute("animation", {
                property: "rotation",
                from: "0 0 0",
                to: "0 0 90",
                dur: 1200,
                easing: "easeInOutQuad"
            });

        } else if (taskNum === 4) {
            status.innerText = "ACTION: PRESS CYCLE START";
            const task = document.querySelector("#cnc-task4");
            const btn = document.querySelector("#cnc-start-btn");
            task.setAttribute("visible", "true");

            btn.setAttribute("animation", {
                property: "position",
                from: "0 0 0.012",
                to: "0 0 -0.010",
                dur: 300,
                dir: "alternate",
                loop: 2,
                easing: "easeInOutSine"
            });
        }
    }
}

/* ============================================================
   TARGET EVENTS
   ============================================================ */
targetGen.addEventListener("targetFound", () => {
    activeTargetIndex = 0;
    updateUI();
});

targetGen.addEventListener("targetLost", () => {
    activeTargetIndex = -1;
    hideAllTaskModels();
    updateUI();
});

targetFanuc.addEventListener("targetFound", () => {
    activeTargetIndex = 1;
    updateUI();
});

targetFanuc.addEventListener("targetLost", () => {
    activeTargetIndex = -1;
    hideAllTaskModels();
    updateUI();
});

updateUI();
</script>

</body>
</html>
