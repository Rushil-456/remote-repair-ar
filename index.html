<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Generator AR Repair</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }

    /*
      IMPORTANT:
      Do NOT style the camera video.
      MindAR controls the camera size.
    */

    a-scene {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;

      width: 100% !important;
      height: 100% !important;

      margin: 0 !important;
      padding: 0 !important;
    }

    #status {
      position: fixed;

      top: 18px;
      left: 50%;

      transform: translateX(-50%);

      z-index: 9999;

      padding: 10px 18px;

      background: rgba(0, 0, 0, 0.75);

      color: white;

      font-family: Arial, sans-serif;

      font-size: 15px;

      border-radius: 10px;

      white-space: nowrap;

      text-align: center;
    }

  </style>

</head>


<body>


  <!-- ===================================== -->
  <!-- STATUS -->
  <!-- ===================================== -->

  <div id="status">
    SCAN GENERATOR
  </div>



  <!-- ===================================== -->
  <!-- AR SCENE -->
  <!-- ===================================== -->

  <a-scene

    mindar-image="
      imageTargetSrc: ./targets.mind;
      maxTrack: 1;
    "

    color-space="sRGB"

    renderer="
      colorManagement: true;
      physicallyCorrectLights: true;
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"

  >


    <!-- ================================= -->
    <!-- CAMERA -->
    <!-- ================================= -->

    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
      wasd-controls="enabled: false">
    </a-camera>



    <!-- ================================= -->
    <!-- LIGHTING -->
    <!-- ================================= -->

    <a-light
      type="ambient"
      intensity="2">
    </a-light>

    <a-light
      type="directional"
      position="1 2 1"
      intensity="2">
    </a-light>



    <!-- ================================= -->
    <!-- GENERATOR IMAGE TARGET -->
    <!-- ================================= -->

    <a-entity
      id="generatorTarget"
      mindar-image-target="targetIndex: 0">


      <!-- ================================= -->
      <!-- 3D LEVER ASSEMBLY -->
      <!-- ================================= -->

      <a-entity
        id="leverAssembly"
        position="0.16 -0.18 0.12"
        scale="0.8 0.8 0.8">


        <!-- ============================== -->
        <!-- MOUNTING BASE -->
        <!-- ============================== -->

        <a-box
          position="0 0 0"
          width="0.22"
          height="0.08"
          depth="0.06">
        </a-box>



        <!-- ============================== -->
        <!-- PIVOT -->
        <!-- ============================== -->

        <a-cylinder
          position="0 0 0.04"
          radius="0.04"
          height="0.07"
          rotation="90 0 0">
        </a-cylinder>



        <!-- ============================== -->
        <!-- MOVING LEVER -->
        <!-- ============================== -->

        <a-entity
          id="lever"
          position="0 0 0.05"
          rotation="0 0 -30">


          <!-- LEVER ARM -->

          <a-box
            position="0 0.10 0"
            width="0.04"
            height="0.20"
            depth="0.04">
          </a-box>



          <!-- HANDLE -->

          <a-cylinder
            position="0 0.21 0"
            radius="0.045"
            height="0.08"
            rotation="90 0 0">
          </a-cylinder>



          <!-- HANDLE END -->

          <a-sphere
            position="0 0.25 0"
            radius="0.045">
          </a-sphere>


        </a-entity>


      </a-entity>


    </a-entity>


  </a-scene>



  <!-- ===================================== -->
  <!-- JAVASCRIPT -->
  <!-- ===================================== -->

  <script>


    const target =
      document.querySelector("#generatorTarget");

    const lever =
      document.querySelector("#lever");

    const status =
      document.querySelector("#status");


    let actionStarted = false;



    // =====================================
    // TARGET FOUND
    // =====================================

    target.addEventListener(
      "targetFound",
      function () {

        console.log("GENERATOR TARGET FOUND");

        status.innerText =
          "GENERATOR DETECTED";


        // Prevent restarting
        // every time tracking changes

        if (actionStarted) {
          return;
        }

        actionStarted = true;


        // Small delay before action

        setTimeout(
          function () {

            startLeverAction();

          },
          800
        );

      }
    );



    // =====================================
    // ACTION 1
    // MOVE LEVER
    // =====================================

    function startLeverAction() {

      console.log("STARTING 3D LEVER ACTION");

      status.innerText =
        "3D REPAIR ACTION";


      // Reset lever

      lever.setAttribute(
        "rotation",
        "0 -0 -30"
      );


      // Add animation

      lever.setAttribute(
        "animation",
        {
          property: "rotation",

          from: "0 0 -30",

          to: "0 0 30",

          dur: 1500,

          easing: "easeInOutSine",

          loop: false

        }
      );

    }



    // =====================================
    // ACTION COMPLETE
    // =====================================

    lever.addEventListener(
      "animationcomplete",
      function () {

        console.log("3D LEVER ACTION COMPLETE");

        status.innerText =
          "ACTION COMPLETE";

      }
    );



    // =====================================
    // TARGET LOST
    // =====================================

    target.addEventListener(
      "targetLost",
      function () {

        console.log("TARGET LOST");

        status.innerText =
          "SCAN GENERATOR";

      }
    );


  </script>


</body>

</html>
