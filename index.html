<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote Repair AR - Isolated Sequential Tasks</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #status {
            position: fixed;
            top: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 0 2px 5px black;
            z-index: 100;
        }
    </style>
</head>

<body>

<div id="status">Point camera at generator</div>

<a-scene
    mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 1;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    renderer="colorManagement: true;">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- LIGHTING -->
    <a-light type="ambient" color="#ffffff" intensity="1.8"></a-light>
    <a-light type="directional" position="1 2 2" intensity="1.5"></a-light>

    <!-- GENERATOR IMAGE TARGET -->
    <a-entity id="generator-target" mindar-image-target="targetIndex: 0">

        <!-- ================================================= -->
        <!-- TASK 1: FUEL CAP ASSEMBLY (Hidden by default)     -->
        <!-- ================================================= -->
        <a-entity id="fuel-cap-assembly" position="-0.22 0.38 0.05" visible="false">
            <a-entity id="fuel-cap-pivot" position="0 0 0" rotation="0 0 0">
                <a-cylinder id="cap-body" position="0 0 0" radius="0.065" height="0.025" color="#ffcc00" metalness="0.8" roughness="0.2"></a-cylinder>
                <a-cylinder position="0 0.015 0" radius="0.04" height="0.01" color="#222222"></a-cylinder>
                <a-cylinder position="0 -0.02 0" radius="0.048" height="0.02" color="#888888"></a-cylinder>
            </a-entity>
            <a-ring position="0 -0.01 0" rotation="-90 0 0" radius-inner="0.045" radius-outer="0.07" color="#111111"></a-ring>
        </a-entity>

        <!-- ================================================= -->
        <!-- TASK 2: LEVER & PIVOT ASSEMBLY (Hidden by default)-->
        <!-- ================================================= -->
        <a-entity id="repair-lever" position="0.16 -0.18 0.12" scale="0.8 0.8 0.8" visible="false">
            <a-box position="0 0 0" width="0.14" height="0.09" depth="0.035" color="#555555"></a-box>
            <a-cylinder position="0 0 0.035" radius="0.035" height="0.045" rotation="90 0 0" color="#aaaaaa"></a-cylinder>
            
            <a-entity id="moving-lever" position="0 0 0.055" rotation="0 0 -25">
                <a-box id="lever-arm" position="0 0.09 0" width="0.035" height="0.18" depth="0.035" color="#ffcc00"></a-box>
                <a-cylinder position="0 0.19 0" radius="0.035" height="0.08" rotation="90 0 0" color="#222222"></a-cylinder>
                <a-sphere position="0 0.23 0" radius="0.045" color="#333333"></a-sphere>
            </a-entity>
        </a-entity>

        <!-- ================================================= -->
        <!-- TASK 3: SIDE PANEL COVER (Hidden by default)      -->
        <!-- ================================================= -->
        <a-entity id="side-panel-cover" position="0.22 0.15 0.08" visible="false">
            <a-box id="panel-body" width="0.22" height="0.28" depth="0.02" color="#ffcc00" material="transparent: true; opacity: 1"></a-box>
            <a-box position="0 0 0.02" width="0.04" height="0.08" depth="0.02" color="#111111"></a-box>
        </a-entity>

    </a-entity>
</a-scene>

<script>
const target = document.querySelector("#generator-target");
const status = document.querySelector("#status");

const fuelCapAssembly = document.querySelector("#fuel-cap-assembly");
const capPivot = document.querySelector("#fuel-cap-pivot");

const repairLever = document.querySelector("#repair-lever");
const movingLever = document.querySelector("#moving-lever");

const sidePanel = document.querySelector("#side-panel-cover");
const panelBody = document.querySelector("#panel-body");

let timer1 = null;
let timer2 = null;
let timer3 = null;

function resetAllTasks() {
    // Hide all entities
    fuelCapAssembly.setAttribute("visible", "false");
    repairLever.setAttribute("visible", "false");
    sidePanel.setAttribute("visible", "false");

    // Reset Task 1 (Fuel Cap)
    capPivot.removeAttribute("animation__rotate");
    capPivot.removeAttribute("animation__lift");
    capPivot.setAttribute("rotation", "0 0 0");
    capPivot.setAttribute("position", "0 0 0");

    // Reset Task 2 (Lever)
    movingLever.removeAttribute("animation__pivot");
    movingLever.setAttribute("rotation", "0 0 -25");

    // Reset Task 3 (Side Panel)
    sidePanel.removeAttribute("animation__move");
    panelBody.removeAttribute("animation__fade");
    sidePanel.setAttribute("position", "0.22 0.15 0.08");
    panelBody.setAttribute("material", "transparent: true; opacity: 1");
}

target.addEventListener("targetFound", () => {
    resetAllTasks();

    // =========================================================
    // TASK 1: UNSCREW FUEL CAP (0s - 5s)
    // =========================================================
    status.innerText = "TASK 1: UNSCREW FUEL CAP (0-5s)";
    fuelCapAssembly.setAttribute("visible", "true");

    capPivot.setAttribute("animation__rotate", {
        property: "rotation",
        to: "0 -720 0",
        dur: 3000,
        easing: "easeInOutQuad"
    });

    capPivot.setAttribute("animation__lift", {
        property: "position",
        to: "0 0.20 0",
        dur: 3000,
        easing: "easeInOutQuad"
    });

    // =========================================================
    // TASK 2: LEVER & PIVOT ACTION (At 5th sec)
    // =========================================================
    timer1 = setTimeout(() => {
        // Hide Task 1, Show Task 2
        fuelCapAssembly.setAttribute("visible", "false");
        repairLever.setAttribute("visible", "true");
        status.innerText = "TASK 2: ACTUATE LEVER & PIVOT (5-10s)";

        movingLever.setAttribute("animation__pivot", {
            property: "rotation",
            from: "0 0 -25",
            to: "0 0 35",
            dur: 1250,
            easing: "easeInOutSine",
            loop: 2,
            dir: "alternate"
        });

        // =========================================================
        // TASK 3: REMOVE SIDE PANEL COVER (At 10th sec)
        // =========================================================
        timer2 = setTimeout(() => {
            // Hide Task 2, Show Task 3
            repairLever.setAttribute("visible", "false");
            sidePanel.setAttribute("visible", "true");
            status.innerText = "TASK 3: REMOVE SIDE PANEL COVER (10-15s)";

            // Slide side panel outward
            sidePanel.setAttribute("animation__move", {
                property: "position",
                to: "0.22 0.15 0.40",
                dur: 3000,
                easing: "easeOutQuad"
            });

            // Fade panel transparency out
            panelBody.setAttribute("animation__fade", {
                property: "components.material.material.opacity",
                to: 0,
                dur: 3000,
                easing: "easeOutQuad"
            });

            // End Sequence
            timer3 = setTimeout(() => {
                sidePanel.setAttribute("visible", "false");
                status.innerText = "ALL REPAIR TASKS COMPLETED SUCCESSFULLY!";
            }, 3000);

        }, 5000); // 10th second trigger

    }, 5000); // 5th second trigger
});

target.addEventListener("targetLost", () => {
    status.innerText = "Point camera at generator";

    // Clear active sequence timers
    if (timer1) clearTimeout(timer1);
    if (timer2) clearTimeout(timer2);
    if (timer3) clearTimeout(timer3);

    resetAllTasks();
});
</script>

</body>
</html>
