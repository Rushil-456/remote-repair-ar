<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>High-Quality AR Assistant</title>
    
    <!-- A-Frame and MindAR Libraries -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent !important;
        }

        /* Forces full screen camera feed with crisp rendering */
        video {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            object-fit: cover !important;
            z-index: 1 !important;
            display: block !important;
        }

        .a-canvas {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            z-index: 2 !important;
            background-color: transparent !important;
        }

        #status {
            position: fixed;
            top: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            color: #ffffff;
            font-family: Arial, sans-serif;
            font-size: 15px;
            font-weight: bold;
            text-shadow: 0 2px 6px rgba(0,0,0,0.9);
            z-index: 100;
        }

        #controls {
            position: fixed;
            bottom: 25px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 8px;
            z-index: 100;
            flex-wrap: wrap;
            padding: 0 10px;
            box-sizing: border-box;
        }

        .btn {
            background: rgba(15, 15, 15, 0.9);
            color: #ffcc00;
            border: 2px solid #ffcc00;
            padding: 10px 14px;
            font-family: Arial, sans-serif;
            font-size: 12px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .btn:active {
            background: #ffcc00;
            color: #000;
        }

        .a-enter-vr { display: none !important; }
    </style>
</head>

<body>

<div id="status">Point camera at machine image</div>

<div id="controls">
    <!-- GENERATOR CONTROLS -->
    <button class="btn" onclick="runAction('gen-fuel')">Gen Fuel Cap</button>
    <button class="btn" onclick="runAction('gen-throttle')">Gen Throttle</button>
    
    <!-- CNC CONTROLS -->
    <button class="btn" onclick="runAction('cnc-estop')">CNC E-Stop</button>
    <button class="btn" onclick="runAction('cnc-start')">CNC Start</button>
</div>

<!-- 
    QUALITY OPTIMIZATIONS ADDED:
    1. videoSettings: Requests 4K (3840x2160) camera feed first, falls back to 1080p.
    2. renderer: precision: highp, antialias: true, logarithmicDepthBuffer: true (fixes z-fighting/flicker).
    3. filterMinCF & filterBeta: Extremely low values to remove jitter and stabilize 3D overlays.
-->
<a-scene
    mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 1; filterMinCF: 0.0001; filterBeta: 0.001; videoSettings: {width: {ideal: 3840, max: 3840}, height: {ideal: 2160, max: 2160}, facingMode: 'environment'};"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    renderer="colorManagement: true; precision: highp; antialias: true; alpha: true; transparent: true; logarithmicDepthBuffer: true;">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- HIGH QUALITY LIGHTING -->
    <a-light type="ambient" color="#ffffff" intensity="1.5"></a-light>
    <a-light type="directional" position="2 4 3" intensity="1.8" cast-shadow="true"></a-light>
    <a-light type="directional" position="-2 -2 2" intensity="0.6" color="#ffcc00"></a-light>

    <!-- SINGLE MAIN MACHINE TARGET -->
    <a-entity id="main-target" mindar-image-target="targetIndex: 0">

        <!-- ================================================= -->
        <!-- 1. GENERATOR CONTROLS (MANUAL POSITIONS)          -->
        <!-- ================================================= -->
        
        <!-- Generator Fuel Cap -->
        <a-entity id="gen-fuel" position="-0.4 0.3 0.02" scale="0.5 0.5 0.5">
            <a-cylinder radius="0.08" height="0.02" color="#ff9800" rotation="90 0 0" material="metalness: 0.3; roughness: 0.2"></a-cylinder>
            <a-box position="0 0.02 0.01" width="0.14" height="0.02" depth="0.03" color="#222"></a-box>
        </a-entity>

        <!-- Generator Throttle -->
        <a-entity id="gen-throttle" position="0.4 0.3 0.02" scale="0.5 0.5 0.5">
            <a-box width="0.1" height="0.1" depth="0.02" color="#333"></a-box>
            <a-entity id="gen-throttle-lever" position="0 0 0.02" rotation="0 0 -30">
                <a-box position="0 0.08 0" width="0.02" height="0.16" depth="0.02" color="#ccc" material="metalness: 0.8; roughness: 0.2"></a-box>
                <a-sphere position="0 0.16 0" radius="0.03" color="#d32f2f"></a-sphere>
            </a-entity>
        </a-entity>

        <!-- ================================================= -->
        <!-- 2. CNC PANEL CONTROLS (MANUAL POSITIONS)          -->
        <!-- ================================================= -->

        <!-- CNC E-Stop -->
        <a-entity id="cnc-estop" position="-0.4 -0.3 0.02" scale="0.5 0.5 0.5">
            <a-cylinder radius="0.07" height="0.02" rotation="90 0 0" color="#ffeb3b"></a-cylinder>
            <a-cylinder id="cnc-estop-button" radius="0.05" height="0.04" rotation="90 0 0" color="#d32f2f" position="0 0 0.01"></a-cylinder>
        </a-entity>

        <!-- CNC Cycle Start -->
        <a-entity id="cnc-start" position="0.4 -0.3 0.02" scale="0.5 0.5 0.5">
            <a-box width="0.08" height="0.08" depth="0.02" color="#222"></a-box>
            <a-cylinder id="cnc-start-button" radius="0.03" height="0.025" rotation="90 0 0" color="#2ecc71" position="0 0 0.01"></a-cylinder>
        </a-entity>

    </a-entity>

</a-scene>

<script>
const mainTarget = document.querySelector('#main-target');
const status = document.querySelector('#status');

mainTarget.addEventListener('targetFound', () => {
    status.innerText = "Machine Detected!";
});

mainTarget.addEventListener('targetLost', () => {
    status.innerText = "Point camera at machine image";
});

// Force WebGL Canvas to match device pixel ratio for maximum sharpness
window.addEventListener('load', () => {
    const sceneEl = document.querySelector('a-scene');
    if (sceneEl) {
        sceneEl.addEventListener('render-target-loaded', () => {
            const renderer = sceneEl.renderer;
            if (renderer) {
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            }
        });
    }
});

// Manual Animation Trigger Function
function runAction(targetId) {
    if (targetId === 'gen-fuel') {
        const item = document.querySelector('#gen-fuel');
        item.removeAttribute('animation');
        item.setAttribute('animation', { property: 'rotation', to: '0 0 360', dur: 1000, easing: 'easeInOutQuad' });
    } 
    else if (targetId === 'gen-throttle') {
        const item = document.querySelector('#gen-throttle-lever');
        item.removeAttribute('animation');
        item.setAttribute('animation', { property: 'rotation', from: '0 0 -30', to: '0 0 40', dur: 600, dir: 'alternate', loop: 2 });
    }
    else if (targetId === 'cnc-estop') {
        const item = document.querySelector('#cnc-estop-button');
        item.removeAttribute('animation');
        item.setAttribute('animation', { property: 'position', to: '0 0 -0.01', dur: 200, dir: 'alternate', loop: 2 });
    }
    else if (targetId === 'cnc-start') {
        const item = document.querySelector('#cnc-start-button');
        item.removeAttribute('animation');
        item.setAttribute('animation', { property: 'position', to: '0 0 -0.01', dur: 200, dir: 'alternate', loop: 2 });
    }
}
</script>

</body>
</html>
