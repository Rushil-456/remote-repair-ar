<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote Repair AR</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #status {
            position: fixed;
            top: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 0 2px 5px black;
            z-index: 100;
        }
    </style>
</head>

<body>

<div id="status">Point camera at generator</div>

<a-scene
    mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 1;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    renderer="colorManagement: true;">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-light type="ambient" color="#ffffff" intensity="2"></a-light>
    <a-light type="directional" position="1 2 2" intensity="2"></a-light>

    <!-- GENERATOR IMAGE TARGET -->
    <a-entity id="generator-target" mindar-image-target="targetIndex: 0">

        <!-- 3D LEVER ASSEMBLY -->
        <a-entity id="repair-lever" position="0.16 -0.18 0.12" scale="0.8 0.8 0.8">
            <!-- MOUNTING BASE -->
            <a-box position="0 0 0" width="0.14" height="0.09" depth="0.035" color="#555555"></a-box>

            <!-- PIVOT CYLINDER -->
            <a-cylinder position="0 0 0.035" radius="0.035" height="0.045" rotation="90 0 0" color="#aaaaaa"></a-cylinder>

            <!-- MOVING LEVER -->
            <a-entity id="moving-lever" position="0 0 0.055" rotation="0 0 -25"
                animation="property: rotation; from: 0 0 -25; to: 0 0 25; dur: 1000; easing: easeInOutSine; loop: true; dir: alternate;">
                <a-box position="0 0.09 0" width="0.035" height="0.18" depth="0.035" color="#777777"></a-box>
                <a-cylinder position="0 0.19 0" radius="0.035" height="0.08" rotation="90 0 0" color="#222222"></a-cylinder>
                <a-sphere position="0 0.23 0" radius="0.045" color="#333333"></a-sphere>
            </a-entity>
        </a-entity>

        <!-- NEW TASK FEATURE: PROTECTIVE COVER PANEL TO BE REMOVED -->
        <a-entity id="cover-panel" position="-0.15 0 0.05" visible="true">
            <!-- Main Cover Box -->
            <a-box width="0.2" height="0.2" depth="0.02" color="#cc3333" material="transparent: true; opacity: 1"></a-box>
            <!-- Handle on Cover -->
            <a-box position="0 0 0.02" width="0.04" height="0.08" depth="0.02" color="#111111"></a-box>
        </a-entity>

    </a-entity>
</a-scene>

<script>
const target = document.querySelector("#generator-target");
const status = document.querySelector("#status");
const coverPanel = document.querySelector("#cover-panel");

let taskTimer = null;

target.addEventListener("targetFound", () => {
    status.innerText = "3D REPAIR ACTION ACTIVE";

    // Trigger removal task after 5 seconds
    taskTimer = setTimeout(() => {
        status.innerText = "TASK 2: REMOVING PROTECTIVE COVER";

        // 1. Animate cover moving outward away from generator
        coverPanel.setAttribute("animation__move", {
            property: "position",
            to: "-0.15 0 0.35",
            dur: 1500,
            easing: "easeOutQuad"
        });

        // 2. Animate cover fading out
        const mainBox = coverPanel.querySelector("a-box");
        mainBox.setAttribute("animation__fade", {
            property: "components.material.material.opacity",
            to: 0,
            dur: 1500,
            easing: "easeOutQuad"
        });

        // 3. Hide entity completely after animations finish
        setTimeout(() => {
            coverPanel.setAttribute("visible", "false");
            status.innerText = "COVER REMOVED SUCCESSFULLY";
        }, 1500);

    }, 5000);
});

target.addEventListener("targetLost", () => {
    status.innerText = "Point camera at generator";

    // Clear active timer if tracking is lost early
    if (taskTimer) {
        clearTimeout(taskTimer);
        taskTimer = null;
    }

    // Reset cover panel position and visibility for next detection
    coverPanel.removeAttribute("animation__move");
    coverPanel.setAttribute("position", "-0.15 0 0.05");
    coverPanel.setAttribute("visible", "true");

    const mainBox = coverPanel.querySelector("a-box");
    mainBox.removeAttribute("animation__fade");
    mainBox.setAttribute("material", "transparent: true; opacity: 1");
});
</script>

</body>
</html>
