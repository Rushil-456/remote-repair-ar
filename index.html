<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Remote Repair System</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: #1e293b;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 420px;
            width: 90%;
            border: 1px solid #334155;
        }
        h1 { color: #f59e0b; font-size: 1.75rem; margin-bottom: 0.5rem; }
        p { color: #94a3b8; font-size: 0.95rem; margin-bottom: 1.5rem; }
        .room-input {
            padding: 0.75rem;
            width: 100%;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            text-align: center;
            font-size: 1rem;
            margin-bottom: 1.5rem;
        }
        .btn-group { display: flex; flex-direction: column; gap: 1rem; }
        .role-btn {
            display: flex; align-items: center; justify-content: center;
            padding: 1rem; font-size: 1rem; font-weight: 700;
            text-decoration: none; border-radius: 10px; transition: all 0.2s ease;
        }
        .btn-tech { background: #f59e0b; color: #0f172a; }
        .btn-tech:hover { background: #d97706; }
        .btn-expert { background: #3b82f6; color: #ffffff; }
        .btn-expert:hover { background: #2563eb; }
    </style>
</head>
<body>

<div class="card">
    <h1>AR Remote Repair</h1>
    <p>Select your session role to begin guidance</p>

    <input type="text" id="roomId" class="room-input" value="repair-session-01" placeholder="Enter Session Room ID">

    <div class="btn-group">
        <a href="#" onclick="launchRole('technician.html')" class="role-btn btn-tech">
            🔧 Field Technician
        </a>
        <a href="#" onclick="launchRole('expert.html')" class="role-btn btn-expert">
            💻 Remote Repair Expert
        </a>
    </div>
</div>

<script>
    function launchRole(page) {
        const roomId = document.getElementById('roomId').value.trim() || 'repair-session-01';
        window.location.href = `${page}?room=${encodeURIComponent(roomId)}`;
    }
</script>

</body>
</html>
