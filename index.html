<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Remote Repair AR</title>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #status {

            position: fixed;

            top: 20px;
            left: 0;

            width: 100%;

            text-align: center;

            color: white;

            font-family: Arial, sans-serif;

            font-size: 20px;

            font-weight: bold;

            text-shadow: 0 2px 5px black;

            z-index: 100;

        }

    </style>

</head>


<body>


<div id="status">
    Point camera at generator
</div>


<a-scene

    mindar-image="
        imageTargetSrc: ./targets.mind;
        maxTrack: 1;
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"

>


    <!-- CAMERA -->

    <a-camera
        position="0 0 0"
        look-controls="enabled: false">
    </a-camera>


    <!-- LIGHT -->

    <a-light
        type="ambient"
        color="#ffffff"
        intensity="2">
    </a-light>

    <a-light
        type="directional"
        position="1 2 2"
        intensity="2">
    </a-light>


    <!-- ================================= -->
    <!-- GENERATOR TARGET -->
    <!-- ================================= -->

    <a-entity
        id="generator-target"
        mindar-image-target="targetIndex: 0">


        <!-- ================================= -->
        <!-- 3D REMOVABLE COMPONENT -->
        <!-- ================================= -->

        <a-entity
            id="removable-component"

            position="0.20 -0.18 0.12"

            scale="0.8 0.8 0.8"
        >


            <!-- ================================= -->
            <!-- MOUNTING PLATE -->
            <!-- ================================= -->

            <a-box

                width="0.18"
                height="0.14"
                depth="0.04"

                color="#555555"

            >
            </a-box>


            <!-- ================================= -->
            <!-- FOUR BOLTS -->
            <!-- ================================= -->

            <a-cylinder
                position="-0.07 0.05 0.035"
                radius="0.012"
                height="0.015"
                rotation="90 0 0"
                color="#bbbbbb">
            </a-cylinder>


            <a-cylinder
                position="0.07 0.05 0.035"
                radius="0.012"
                height="0.015"
                rotation="90 0 0"
                color="#bbbbbb">
            </a-cylinder>


            <a-cylinder
                position="-0.07 -0.05 0.035"
                radius="0.012"
                height="0.015"
                rotation="90 0 0"
                color="#bbbbbb">
            </a-cylinder>


            <a-cylinder
                position="0.07 -0.05 0.035"
                radius="0.012"
                height="0.015"
                rotation="90 0 0"
                color="#bbbbbb">
            </a-cylinder>


            <!-- ================================= -->
            <!-- REMOVABLE COVER -->
            <!-- ================================= -->

            <a-entity
                id="moving-cover"

                position="0 0 0.055"

                animation__remove="

                    property: position;

                    from: 0 0 0.055;

                    to: 0 0.25 0.25;

                    dur: 1800;

                    easing: easeInOutQuad;

                    loop: true;

                    dir: alternate;

                "
            >


                <!-- COVER -->

                <a-box

                    width="0.16"
                    height="0.11"
                    depth="0.025"

                    color="#777777"

                >
                </a-box>


                <!-- CENTER DETAIL -->

                <a-cylinder

                    position="0 0 0.02"

                    radius="0.025"

                    height="0.01"

                    rotation="90 0 0"

                    color="#aaaaaa"

                >
                </a-cylinder>


            </a-entity>


        </a-entity>


    </a-entity>


</a-scene>


<script>


const target =
    document.querySelector("#generator-target");


const status =
    document.querySelector("#status");


target.addEventListener(
    "targetFound",
    () => {

        status.innerText =
            "3D COMPONENT REMOVAL";

    }
);


target.addEventListener(
    "targetLost",
    () => {

        status.innerText =
            "Point camera at generator";

    }
);


</script>


</body>

</html>
